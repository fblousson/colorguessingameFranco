
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Great Guessing Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="colorgame.js" defer></script>
</head>

<body>

    <h1>
        COLOR 
        <br>
        <span id="colorDisplay">RGB</span>
        <br>
        GUESSING GAME
    </h1>

    <div id="stripe">

        <button id="reset">Nuevos Colores</button>

        <span id="message"></span>

        <div id="difficulty">
            <button class="mode-button">Easy</button>
            <button class="mode-button selected">Hard</button>
        </div>

    </div>

    <main id="container">

        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>
        <div class="square"></div>

    </main>

</body>

</html>
